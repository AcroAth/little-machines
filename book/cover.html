/* ---- palette: tokens copied verbatim from language-modeling.html ---- */
:root{
  --ground:#FBFAF7; --ink:#201D1A; --ink2:#6B6560; --hair:#E8E4DC;
  --byte:#2E56C6; --byte-fill:#EFF2FA; --byte-border:#C9D4F0;
  --token:#C93F27; --token-fill:#FDEAE4; --token-border:#F0B8A9;
  --gold:#B97D0F; --gold-mark:#F5C86A; --green:#2E7D4F;
  --gray:#9C968E; --gray-fill:#E7E3DC;
  --shadow:rgba(32,29,26,.10);
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#171511; --ink:#F1ECE4; --ink2:#A79F94; --hair:#2E2A24;
    --byte:#8FA8F5; --byte-fill:#1D2436; --byte-border:#33406A;
    --token:#FF9377; --token-fill:#38201A; --token-border:#6B3A2E;
    --gold:#E9B85C; --gold-mark:#E9B85C; --green:#6BC493;
    --gray:#8A857D; --gray-fill:#2A2620;
    --shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="light"]{
  --ground:#FBFAF7; --ink:#201D1A; --ink2:#6B6560; --hair:#E8E4DC;
  --byte:#2E56C6; --byte-fill:#EFF2FA; --byte-border:#C9D4F0;
  --token:#C93F27; --token-fill:#FDEAE4; --token-border:#F0B8A9;
  --gold:#B97D0F; --gold-mark:#F5C86A; --green:#2E7D4F;
  --gray:#9C968E; --gray-fill:#E7E3DC; --shadow:rgba(32,29,26,.10);
}
:root[data-theme="dark"]{
  --ground:#171511; --ink:#F1ECE4; --ink2:#A79F94; --hair:#2E2A24;
  --byte:#8FA8F5; --byte-fill:#1D2436; --byte-border:#33406A;
  --token:#FF9377; --token-fill:#38201A; --token-border:#6B3A2E;
  --gold:#E9B85C; --gold-mark:#E9B85C; --green:#6BC493;
  --gray:#8A857D; --gray-fill:#2A2620; --shadow:rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:18px; line-height:1.65;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.lm{ --col:40rem; }
.lm :focus-visible{ outline:2.5px solid var(--gold); outline-offset:3px; border-radius:3px; }
.hand{ font-family:"Patrick Hand","Segoe Print","Comic Sans MS",cursive; font-weight:400; }
.sronly{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* =====================================================================
   THE MACHINE — CSS copied verbatim from the-bitter-lesson.html (lidded).
   ===================================================================== */
.mch{ display:inline-block; width:58px; height:56px; flex:none; will-change:transform; }
.mch svg{ width:100%; height:100%; overflow:visible; }
.mch .m-body{ fill:var(--byte-fill); stroke:var(--ink); stroke-width:2; stroke-linejoin:round; }
.mch .m-eyew{ fill:var(--ground); stroke:var(--ink); stroke-width:2; transition:transform .18s ease; transform-box:fill-box; transform-origin:center; }
.mch .m-pupil{ fill:var(--ink); transition:transform .2s cubic-bezier(.3,.9,.3,1); transform-box:fill-box; transform-origin:center; }
.mch .m-lid{ fill:var(--byte-fill); stroke:var(--ink); stroke-width:2; stroke-linecap:round; transition:transform .16s ease; transform-box:fill-box; transform-origin:center top; transform:scaleY(0); }
.mch .m-brow{ stroke:var(--ink); stroke-width:2; stroke-linecap:round; fill:none; opacity:0; transition:opacity .16s ease; }
.mch .m-antenna{ stroke:var(--ink); stroke-width:2; stroke-linecap:round; fill:none; }
.mch .m-bulb{ fill:var(--ground); stroke:var(--ink); stroke-width:2; }
.mch .m-foot{ fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; }
/* expressions */
.mch.think .m-eyew{ transform:scaleY(.62); }
.mch.think .m-brow{ opacity:1; }
.mch.surprised .m-eyew{ transform:scale(1.28); }
.mch.surprised .m-pupil{ transform:scale(.72); }
.mch.settle .m-pupil{ transform:translateY(1.2px); }
.mch.settle .m-eyew{ transform:scaleY(.9); }
.mch.blink .m-lid{ transform:scaleY(1); }
.mch.nap .m-lid{ transform:scaleY(.5); }               /* new: dozing — half-lidded */
.mch.nap .m-pupil{ transform:translateY(1px) scale(.92); }
/* reactions (squash/stretch, <=320ms) */
.mch.pop{ animation:mchpop .3s cubic-bezier(.3,1.5,.4,1); }
@keyframes mchpop{ 0%{transform:scale(1,1)} 35%{transform:scale(1.12,.9)} 70%{transform:scale(.95,1.06)} 100%{transform:scale(1,1)} }
.mch.gasp{ animation:mchgasp .32s cubic-bezier(.3,1.4,.4,1); }
@keyframes mchgasp{ 0%{transform:translateY(0) scale(1)} 40%{transform:translateY(-5px) scale(1.06,1.02)} 100%{transform:translateY(0) scale(1)} }
.reduced .mch.pop,.reduced .mch.gasp{ animation:none; }
.reduced .mch .m-eyew,.reduced .mch .m-pupil,.reduced .mch .m-lid{ transition:none; }
.mch-line{ display:flex; align-items:center; gap:.7rem; margin:.6rem 0 .2rem; }
.mch-say{ font-family:"Patrick Hand",cursive; color:var(--ink2); font-size:1.12rem; transform:rotate(-.8deg); }
.reduced .mch-say{ transform:none; }

/* =====================================================================
   THE COVER FIELD — the one page that is not a column.
   Plain ground, deliberately underpopulated; absolute characters banded
   by vertical zone so they never collide with the centered title.
   ===================================================================== */
.cover-field{ position:relative; min-height:100vh; min-height:100svh; width:100%; overflow-x:hidden; }

.cover-center{ position:absolute; left:50%; top:27%; transform:translateX(-50%); width:min(40rem,92vw); text-align:center; padding:0 1rem; }
h1{ font-size:clamp(2.6rem,6.5vw,3.6rem); font-weight:700; line-height:1.05; letter-spacing:-.015em; margin:0; text-wrap:balance; }
.promise{ color:var(--ink2); font-size:1.1rem; line-height:1.5; margin:1.1rem auto 0; max-width:33rem; text-wrap:balance; }

/* ---- the enter mark: a hand-drawn gold ellipse around a Patrick Hand word ---- */
.enter{ position:relative; display:inline-block; margin-top:2.2rem; text-decoration:none; -webkit-tap-highlight-color:transparent; }
.enter-inner{ position:relative; display:inline-block; padding:.34em .95em .4em; transform-origin:center; }
.enter:not(.rested) .enter-inner{ animation:enterWiggle 4s ease-in-out infinite; }
@keyframes enterWiggle{ 0%,84%,100%{transform:rotate(0)} 88%{transform:rotate(1.5deg)} 92%{transform:rotate(-1.5deg)} 96%{transform:rotate(.7deg)} }
.enter-word{ position:relative; z-index:1; color:var(--gold); font-size:1.6rem; line-height:1; transition:filter .2s ease; }
.enter:hover .enter-word, .enter:focus-visible .enter-word{ filter:brightness(.9); }
.enter-ell{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
.enter-ell path{ fill:none; stroke:var(--gold-mark); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:100; stroke-dashoffset:0; }
.enter:hover .enter-ell path, .enter:focus-visible .enter-ell path{ animation:enterDraw .32s ease-out; }
@keyframes enterDraw{ from{stroke-dashoffset:100} to{stroke-dashoffset:0} }
/* static gold underline: the reduced-motion affordance (no wiggle, no redraw) */
.enter-ul{ display:none; position:absolute; left:.95em; right:.95em; bottom:.24em; height:2px; background:var(--gold); border-radius:2px; }
.reduced .enter:not(.rested) .enter-inner{ animation:none; }
.reduced .enter:hover .enter-ell path, .reduced .enter:focus-visible .enter-ell path{ animation:none; }
.reduced .enter-ul{ display:block; }

/* ---- character slots (banded by vertical zone) ---- */
.cov-char{ position:absolute; }
.cov-mch-wrap{ left:14%; top:70%; }
.cov-blob-wrap{ right:12%; top:13%; }

/* the machine wants you to go in: pupils shifted toward the enter mark (CSS only —
   machineSVG() geometry is byte-identical to source; the glance is a transform) */
#covMch{ width:64px; height:60px; cursor:pointer; }
.mch.look-in .m-pupil{ transform:translate(1.4px,-1.3px); }

/* the machine's aside — ink speech, never gold (gold is touch-invitation only) */
.cov-mch-wrap .mch-say{ position:absolute; left:76px; top:6px; width:max-content; max-width:min(46vw,19rem); }
.cov-mch-wrap .mch-say[hidden]{ display:none; }

/* ---- the blob: gray tired lump ported from bpe-north-star.html (mono text label omitted) ---- */
.blob{ display:inline-block; width:80px; cursor:pointer; }
.blob-svg{ display:block; width:100%; height:auto; overflow:visible; }
.blob-breathe{ animation:blobBreath 5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes blobBreath{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.013)} }
.blob-eye{ animation:blobBlink 7s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes blobBlink{ 0%,90%,100%{transform:scaleY(1)} 94%{transform:scaleY(.12)} 97.5%{transform:scaleY(1)} }
/* gazing off-page, away from the enter mark (CSS-only shift; geometry unchanged) */
.blob-pupil{ transform:translate(1.4px,-.6px); transform-box:fill-box; transform-origin:center; }
.blob.squish{ animation:blobSquish .32s cubic-bezier(.3,1.4,.4,1); }
@keyframes blobSquish{ 0%{transform:scale(1,1)} 40%{transform:scale(1.08,.9)} 100%{transform:scale(1,1)} }
.reduced .blob-breathe, .reduced .blob-eye, .reduced .blob.squish{ animation:none; }

.blob-say{ font-family:"Patrick Hand","Segoe Print","Comic Sans MS",cursive; color:var(--ink2); font-size:1.12rem; transform:rotate(.8deg); }
.reduced .blob-say{ transform:none; }
.cov-blob-wrap .blob-say{ position:absolute; right:calc(100% + 10px); top:6px; width:max-content; max-width:min(46vw,18rem); text-align:right; }
.cov-blob-wrap .blob-say[hidden]{ display:none; }

/* aside fade lifecycle (distinct keyframe names so the animationend cleanup ignores them) */
.say-in{ animation:sayIn .3s ease-out; }
.say-out{ animation:sayOut .4s ease-out forwards; }
@keyframes sayIn{ from{opacity:0} }
@keyframes sayOut{ to{opacity:0} }

/* ---- the cast whisper: frontier-cue register (ink words, gold breathing dots) ---- */
.cast-whisper{
  position:absolute; right:8%; bottom:11%; max-width:16rem; text-align:right;
  font-family:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;
  color:var(--ink2); font-size:1.05rem; line-height:1.3; transform:rotate(-1.5deg);
}
.reduced .cast-whisper{ transform:none; }
.cue .d{ display:inline-block; color:var(--gold); animation:cueDot 2.8s ease-in-out infinite; }
.cue .d:nth-child(2){ animation-delay:.35s; } .cue .d:nth-child(3){ animation-delay:.7s; }
@keyframes cueDot{ 0%,55%,100%{opacity:.3} 25%{opacity:1} }
.reduced .cue .d{ animation:none; opacity:1; }

/* ---- on-load entrance (decoration only; instant under reduced motion) ---- */
@keyframes fadeReveal{ from{opacity:0} }
.fade-in{ animation:fadeReveal .4s ease-out both; }
.reduced .fade-in{ animation:none; }

@media (max-width:480px){
  .cover-center{ top:15%; width:94vw; }
  h1{ font-size:clamp(2rem,9vw,2.6rem); }
  .promise{ font-size:1.02rem; }
  .cov-blob-wrap{ right:5%; top:3.5%; }
  .blob{ width:60px; }
  .cov-blob-wrap .blob-say{ max-width:56vw; }
  .cov-mch-wrap{ left:8%; top:74%; }
  #covMch{ width:56px; height:53px; }
  .cov-mch-wrap .mch-say{ left:0; top:-2.5em; max-width:62vw; }
  .cast-whisper{ right:6%; bottom:7%; max-width:60vw; }
}
</style>

<div class="lm" id="lm">
  <main class="cover-field">
    <div class="cover-center fade-in">
      <h1>little machines</h1>
      <p class="promise fade-in" style="animation-delay:.12s">a touchable notebook for the things I'm learning</p>
      <a class="enter fade-in" style="animation-delay:.24s" href="contents.html" target="_blank" rel="noopener">
        <span class="enter-inner">
          <span class="enter-word hand">enter</span>
          <span class="enter-ul" aria-hidden="true"></span>
          <svg class="enter-ell" viewBox="0 0 120 56" preserveAspectRatio="none" aria-hidden="true"><path pathLength="100" d="M8 29 C 6 13, 42 6, 62 7 C 96 8, 116 12, 113 28 C 111 44, 82 51, 58 50 C 26 49, 10 45, 8 29 Z"/></svg>
        </span>
        <span class="sronly"> — open the book</span>
      </a>
    </div>

    <div class="cov-char cov-mch-wrap fade-in" style="animation-delay:.36s">
      <span class="mch idle look-in" id="covMch" role="button" tabindex="0" aria-label="the little machine — say hello"></span>
      <span class="mch-say" id="covMchSay" hidden aria-hidden="true">it guesses what comes next</span>
    </div>

    <div class="cov-char cov-blob-wrap fade-in" style="animation-delay:.36s">
      <span class="blob" id="covBlob" role="button" tabindex="0" aria-label="the gray blob — say hello">
        <svg class="blob-svg" viewBox="-4 4 104 86" aria-hidden="true">
          <g class="blob-breathe">
            <path d="M20 78 q -18 -2 -16 -30 q 1 -30 34 -34 q 30 -4 44 12 q 20 20 6 44 q -8 14 -34 12 q -18 -1 -34 -4 z" fill="var(--gray-fill)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
            <ellipse class="blob-eye" cx="38" cy="42" rx="5.5" ry="6" fill="var(--ground)" stroke="var(--ink)" stroke-width="2"/>
            <ellipse class="blob-eye" cx="62" cy="42" rx="5.5" ry="6" fill="var(--ground)" stroke="var(--ink)" stroke-width="2"/>
            <circle class="blob-pupil" cx="38" cy="44" r="2" fill="var(--ink)"/><circle class="blob-pupil" cx="62" cy="44" r="2" fill="var(--ink)"/>
            <path d="M30 39 q 7 -4 14 0 M54 39 q 7 -4 14 0" stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M39 65 q 11 -7 22 0" stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
      </span>
      <span class="blob-say" id="covBlobSay" hidden aria-hidden="true">it swallows what it doesn't know</span>
    </div>

    <p class="cast-whisper hand fade-in" style="animation-delay:.48s">the rest of the cast hasn't been written yet<span class="cue"><span class="d">.</span><span class="d">.</span><span class="d">.</span></span></p>
  </main>
  <div class="sronly" id="srlive" aria-live="polite"></div>
</div>

<script>
(function(){
  "use strict";
  var REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var root = document.getElementById("lm");
  if(REDUCED) root.classList.add("reduced");

  /* ===================== the little machine (SVG character) ===================== */
  function machineSVG(){
    return '<svg viewBox="0 0 60 56" aria-hidden="true">'
      + '<path class="m-foot" d="M22 49 q-1 4 -5 4 M38 49 q1 4 5 4"/>'
      + '<path class="m-antenna" d="M30 8 v-5"/><circle class="m-bulb" cx="30" cy="2.5" r="2.6"/>'
      + '<path class="m-body" d="M8 34 C8 16 20 8 30 8 C40 8 52 16 52 34 C52 45 44 50 30 50 C16 50 8 45 8 34 Z"/>'
      + '<path class="m-brow" d="M15 20 q4 -3 8 -1 M37 19 q4 -2 8 1"/>'
      + '<ellipse class="m-eyew" cx="22.5" cy="30" rx="7.5" ry="8.5"/>'
      + '<ellipse class="m-eyew" cx="37.5" cy="30" rx="7.5" ry="8.5"/>'
      + '<circle class="m-pupil" cx="22.5" cy="31" r="3.1"/>'
      + '<circle class="m-pupil" cx="37.5" cy="31" r="3.1"/>'
      + '<ellipse class="m-lid" cx="22.5" cy="30" rx="8" ry="9"/>'
      + '<ellipse class="m-lid" cx="37.5" cy="30" rx="8" ry="9"/>'
      + '</svg>';
  }
  function mExpr(el, cls){ if(!el) return; el.className = "mch " + cls; }
  function mReact(el, kind){ if(!el || REDUCED) return; el.classList.add(kind); setTimeout(function(){ el.classList.remove(kind); }, 320); }

  var srlive = document.getElementById("srlive");
  function announce(text){ srlive.textContent=""; setTimeout(function(){ srlive.textContent=text; }, 30); }

  /* an aside is a moment: show it, mirror to the live region, retire it after ~4s */
  function saySomething(el, text){
    if(el._t){ clearTimeout(el._t); el._t=null; }
    if(el._t2){ clearTimeout(el._t2); el._t2=null; }
    el.hidden=false;
    if(!REDUCED){ el.classList.remove("say-out","say-in"); void el.offsetWidth; el.classList.add("say-in"); }
    announce(text);
    el._t=setTimeout(function(){
      if(REDUCED){ el.hidden=true; return; }
      el.classList.add("say-out");
      el._t2=setTimeout(function(){ el.hidden=true; el.classList.remove("say-out","say-in"); }, 420);
    }, 4000);
  }

  /* the machine — a pop and a whisper; it stays idle (never mExpr'd, so look-in holds) */
  var covMch = document.getElementById("covMch");
  var covMchSay = document.getElementById("covMchSay");
  covMch.innerHTML = machineSVG();
  function pokeMch(){ mReact(covMch, "pop"); saySomething(covMchSay, "it guesses what comes next"); }
  covMch.addEventListener("click", pokeMch);
  covMch.addEventListener("keydown", function(e){ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); pokeMch(); } });

  /* the blob — a soft squish and a tired aside (squish self-clears; a reaction, not a state) */
  var covBlob = document.getElementById("covBlob");
  var covBlobSay = document.getElementById("covBlobSay");
  function pokeBlob(){
    if(!REDUCED){
      covBlob.classList.remove("squish"); void covBlob.offsetWidth; covBlob.classList.add("squish");
      setTimeout(function(){ covBlob.classList.remove("squish"); }, 340);
    }
    saySomething(covBlobSay, "it swallows what it doesn't know");
  }
  covBlob.addEventListener("click", pokeBlob);
  covBlob.addEventListener("keydown", function(e){ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); pokeBlob(); } });

  /* the enter mark wiggles until the reader first reaches for it, then rests */
  var enter = document.querySelector(".enter");
  function rest(){ enter.classList.add("rested"); }
  enter.addEventListener("pointerenter", rest);
  enter.addEventListener("focus", rest);

  /* idle life: brief lid-blink for any idle machine on screen.
     Interval idiom from language-modeling.html; toggles the ported `blink` class
     so the lids actually close (TBL's lidded machine — not LM's think-flash workaround). */
  if(!REDUCED){
    setInterval(function(){
      var all = root.querySelectorAll(".mch.idle");
      Array.prototype.forEach.call(all, function(m){
        if(Math.random() < 0.5){ m.classList.add("blink"); setTimeout(function(){ m.classList.remove("blink"); }, 150); }
      });
    }, 4200);
  }

  /* completed entrance animations must not linger (ported cleanup idiom) */
  document.addEventListener("animationend", function(e){
    var n=e.animationName;
    if(n==="rise"||n==="fadeReveal"){
      e.target.classList.remove("reveal-anim","fade-in","cue-in");
      if(e.target.style && e.target.style.animationDelay) e.target.style.animationDelay="";
    }
  });
})();
</script>
